name: Publish packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.mirror-manifest.json'
      - 'packages/**'

concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      count: ${{ steps.packages.outputs.count }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Resolve unpublished package versions
        id: packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/resolve-release-packages.ts

  publish:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.packages) }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run verify:packages

      - name: Verify resolved package version
        env:
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_PATH: ${{ matrix.path }}
          RELEASE_VERSION: ${{ matrix.version }}
        run: |
          RESOLVED_NAME="$(bun -e "console.log(require('./${PACKAGE_PATH}/package.json').name)")"
          RESOLVED_VERSION="$(bun -e "console.log(require('./${PACKAGE_PATH}/package.json').version)")"
          test "$RESOLVED_NAME" = "$PACKAGE_NAME"
          test "$RESOLVED_VERSION" = "$RELEASE_VERSION"

      - name: Pack release artifact
        if: matrix.publish
        id: artifact
        env:
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_PATH: ${{ matrix.path }}
          RELEASE_VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cd "$PACKAGE_PATH"
          bun pm pack --destination "$RUNNER_TEMP/release"
          TARBALL_NAME="${PACKAGE_NAME#@}"
          TARBALL_NAME="${TARBALL_NAME/\//-}-${RELEASE_VERSION}.tgz"
          TARBALL_PATH="$RUNNER_TEMP/release/$TARBALL_NAME"
          test -f "$TARBALL_PATH"
          tar -tzf "$TARBALL_PATH"
          echo "path=$TARBALL_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish inspected artifact with provenance
        if: matrix.publish
        run: bunx npm@12.0.2 publish --access public "${{ steps.artifact.outputs.path }}"

      - name: Wait for public registry metadata
        env:
          PACKAGE_NAME: ${{ matrix.name }}
          RELEASE_VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          ENCODED_NAME="${PACKAGE_NAME//\//%2F}"
          METADATA_URL="https://registry.npmjs.org/${ENCODED_NAME}/${RELEASE_VERSION}"

          for attempt in {1..24}; do
            if curl --fail --silent --show-error --output /dev/null "$METADATA_URL"; then
              exit 0
            fi
            sleep 5
          done
          echo "${PACKAGE_NAME}@${RELEASE_VERSION} was not visible after two minutes" >&2
          exit 1

      - name: Verify clean registry consumption
        env:
          PACKAGE_NAME: ${{ matrix.name }}
          RELEASE_VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          FIXTURE="$RUNNER_TEMP/registry-consumer"
          mkdir "$FIXTURE"
          cd "$FIXTURE"
          printf '%s\n' '{"name":"registry-consumer","private":true,"type":"module"}' > package.json
          INSTALLED=false
          for attempt in {1..24}; do
            if bun add --exact "${PACKAGE_NAME}@${RELEASE_VERSION}"; then
              INSTALLED=true
              break
            fi
            rm -rf node_modules bun.lock
            sleep 5
          done
          test "$INSTALLED" = true
          case "$PACKAGE_NAME" in
            '@metricpanel/sdk')
              bun -e "import('@metricpanel/sdk').then((m) => { if (m.METRICPANEL_API_URL !== 'https://api.metricpanel.io/api') process.exit(1) })"
              node -e "import('@metricpanel/sdk').then((m) => { if (typeof m.createMetricPanel !== 'function') process.exit(1) })"
              node -e "const m = require('@metricpanel/sdk'); if (typeof m.createMetricPanel !== 'function') process.exit(1)"
              node -e "import('@metricpanel/sdk/react-native').then((m) => { if (typeof m.createMetricPanelNative !== 'function') process.exit(1) })"
              ;;
            '@metricpanel/ai-crawl')
              bun -e "import('@metricpanel/ai-crawl').then((m) => { if (typeof m.trackAICrawlerRequest !== 'function') process.exit(1) })"
              node -e "import('@metricpanel/ai-crawl').then((m) => { if (typeof m.createMetricPanelAICrawl !== 'function') process.exit(1) })"
              node -e "const m = require('@metricpanel/ai-crawl'); if (typeof m.trackAICrawlerResponse !== 'function') process.exit(1)"
              ;;
            *)
              bun -e "import('${PACKAGE_NAME}').then(() => undefined)"
              node -e "import('${PACKAGE_NAME}').then(() => undefined)"
              ;;
          esac

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ matrix.name }}
          RELEASE_TAG: ${{ matrix.tag }}
          RELEASE_VERSION: ${{ matrix.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$PACKAGE_NAME $RELEASE_VERSION" \
            --generate-notes
