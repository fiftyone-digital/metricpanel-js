name: Publish MetricPanel SDK

on:
  release:
    types: [published]

concurrency:
  group: publish-metricpanel-sdk
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org

      - name: Verify release version
        run: |
          SDK_VERSION="$(bun -e "console.log(require('./package.json').version)")"
          test "${{ github.event.release.tag_name }}" = "v${SDK_VERSION}"

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

      - name: Pack and inspect the release artifact
        run: |
          bun pm pack --destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP/metricpanel-sdk-$(bun -e "console.log(require('./package.json').version)").tgz"

      - name: Publish the inspected artifact
        run: bunx npm@12.0.2 publish --access public "$RUNNER_TEMP/metricpanel-sdk-$(bun -e "console.log(require('./package.json').version)").tgz"

      - name: Verify public registry consumption
        run: |
          SDK_VERSION="$(bun -e "console.log(require('./package.json').version)")"
          REGISTRY_READY=false
          for attempt in {1..12}; do
            if bun pm view "@metricpanel/sdk@${SDK_VERSION}" version >/dev/null; then
              REGISTRY_READY=true
              break
            fi
            sleep 5
          done
          test "$REGISTRY_READY" = true
          mkdir "$RUNNER_TEMP/metricpanel-sdk-registry-fixture"
          cd "$RUNNER_TEMP/metricpanel-sdk-registry-fixture"
          bun init -y
          bun add "@metricpanel/sdk@${SDK_VERSION}"
          bun -e "import('@metricpanel/sdk').then((sdk) => { if (sdk.METRICPANEL_API_URL !== 'https://api.metricpanel.io/api') process.exit(1) })"
          node -e "import('@metricpanel/sdk').then((sdk) => { if (sdk.METRICPANEL_API_URL !== 'https://api.metricpanel.io/api') process.exit(1) })"
          node -e "const sdk = require('@metricpanel/sdk'); if (sdk.METRICPANEL_API_URL !== 'https://api.metricpanel.io/api') process.exit(1)"
